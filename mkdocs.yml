site_name: Meldh
site_description: Meldh LLC builds consumer AI products and publishes reproducible research on model training and evaluation.
site_url: https://meldh.com
site_author: Meldh LLC

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/brand/meldh-mark-header.svg
  favicon: assets/brand/meldh-mark-header.svg
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Meldh-LLC
      name: Meldh LLC on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

copyright: "© 2026 Meldh LLC"

nav:
  - Meldh: index.md
  - Research: research/index.md
